apiVersion: v1.1.0
kind: DataProduct
id: sku_sales
name: SKU Sales
version: v1.0.0
status: active
type: sourceAligned
domain: ecommerce
# type: consumerAligned  # sourceAligned | aggregate | consumerAligned
description:
  purpose: Consumer-aligned data product showing how often each SKU is bought per year, used by the purchasing team for supplier negotiations.
  usage: Intended for use by Purchasing analytics team.
  limitations: 'string'
tags: ['sku', 'sales', 'purchasing']
inputPorts:
  - name: orders
    version: 2.0.0
    contractId: orders_v2_consumer_sku_sales
outputPorts:

  - name: sku_sales_per_year
    description: Aggregated SKU sales per year as a PostgreSQL view.
    type: tables
    version: 1.0.0
    contractId: sku_sales_per_year
support:
  - channel: "#purchasing-analytics"
    url: https://example.slack.com/purchasing-analytics
    tool: slack
team:
  name: purchasing_analytics_team
  members:
   - username: purchasing@example.com
     name: purchasing
     role: owner
